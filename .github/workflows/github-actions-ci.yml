name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restaurar y probar (quality gate A01..A07 + golden-master)
        run: dotnet test FASE-II-DISENO/tests/Redes.Knowledge.Tests/Redes.Knowledge.Tests.csproj --configuration Release

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publicar self-contained (${{ matrix.rid }})
        run: dotnet publish src/Redes.Knowledge.App/Redes.Knowledge.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o dist/${{ matrix.rid }}
        working-directory: FASE-II-DISENO
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: FASE-II-DISENO/dist/${{ matrix.rid }}

  # ─── Instaladores (solo en tags v*) ────────────────────────────────────────────
  package-win:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binario win-x64
        uses: actions/download-artifact@v4
        with:
          name: app-win-x64
          path: FASE-II-DISENO/dist/win-x64
      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compilar instalador (Inno Setup)
        run: iscc FASE-II-DISENO/packaging/windows/Redes.Knowledge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: setup-win-x64
          path: FASE-II-DISENO/dist/NetProtocol-Setup-*.exe

  package-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binario linux-x64
        uses: actions/download-artifact@v4
        with:
          name: app-linux-x64
          path: FASE-II-DISENO/dist/linux-x64
      - name: Empaquetar .deb (Debian/Ubuntu)
        working-directory: FASE-II-DISENO
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p debroot/DEBIAN debroot/usr/lib/netprotocol debroot/usr/share/applications
          cp -a dist/linux-x64/. debroot/usr/lib/netprotocol/
          chmod -R a+rX debroot/usr/lib/netprotocol
          cat > debroot/usr/share/applications/netprotocol.desktop <<'EOF'
          [Desktop Entry]
          Name=Net Protocol
          Comment=Base de conocimiento de protocolos de red
          Exec=/usr/lib/netprotocol/NetProtocol
          Type=Application
          Categories=Network;Utility;
          Terminal=false
          EOF
          cat > debroot/DEBIAN/control <<EOF
          Package: netprotocol
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: liblttng-ust0 (>= 2.12.0), liburcu6 (>= 0.12.1)
          Maintainer: Proyecto Redes
          Description: Net Protocol - base de conocimiento de protocolos de red
           Catálogo, fichas, PDU y seguridad de protocolos de red (Fase I/II).
          EOF
          dpkg-deb --build --root-owner-group debroot "dist/NetProtocol-${VER}-amd64.deb"
      - name: Empaquetar .rpm (Fedora/RHEL)
        working-directory: FASE-II-DISENO
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # rpm no admite guiones en Version (separador version-release); se sustituyen.
          RPM_VER="${VER//-/_}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          mkdir -p rpmbuild
          DISTDIR="${PWD}/dist/linux-x64"
          cat > netprotocol.spec <<EOF
          Name: netprotocol
          Version: ${RPM_VER}
          Release: 1%{?dist}
          Summary: Net Protocol - base de conocimiento de protocolos de red
          License: Proprietary
          URL: https://github.com/kraso/redes-knowledge
          BuildArch: x86_64
          Requires: liblttng-ust0 >= 2.12.0
          Requires: liburcu6 >= 0.12.1

          %description
          Base de conocimiento/consulta de protocolos de red (catálogo F3, fichas F4, PDU F5, seguridad F6).

          %install
          mkdir -p %{buildroot}/usr/lib/netprotocol
          cp -a ${DISTDIR}/. %{buildroot}/usr/lib/netprotocol/

          %files
          /usr/lib/netprotocol/*
          EOF
          rpmbuild --define "_topdir ${PWD}/rpmbuild" -bb netprotocol.spec
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/NetProtocol-${RPM_VER}-x86_64.rpm"
      - name: Firmar .deb/.rpm con GPG (si la clave esta configurada en secretos)
        working-directory: FASE-II-DISENO
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::Clave GPG no configurada (secretos GPG_PRIVATE_KEY / GPG_KEY_ID): instaladores SIN firmar."
            exit 0
          fi
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::GPG_PASSPHRASE vacio: la clave seleccionada esta protegida con frase de contrasena. Añade el secreto GPG_PASSPHRASE y relanza el tag."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          # Pre-cargar la frase de contrasena en el agente GPG (vale para gpg y rpmsign).
          for grip in $(gpg --with-keygrip --list-secret-keys "${GPG_KEY_ID}" 2>/dev/null | awk '/Keygrip/{print $2}'); do
            printf 'PRESET_PASSPHRASE %s -1 %s\n' "$grip" "${GPG_PASSPHRASE}" | gpg-connect-agent /bye || true
          done
          # Firmar el .rpm (firma integrada; verificar con rpm --checksig)
          rpmsign --addsign --define "_gpg_name ${GPG_KEY_ID}" dist/NetProtocol-*.rpm
          rpm --checksig dist/NetProtocol-*.rpm
          # Firmar el .deb con firma adjunta .asc estandar (dpkg-sig fue retirado de
          # los repos de Ubuntu/Debian); verificar con gpg --verify.
          gpg --batch --yes --detach-sign --armor -u "${GPG_KEY_ID}" dist/NetProtocol-*.deb
          gpg --verify dist/NetProtocol-*.deb.asc dist/NetProtocol-*.deb
          # Clave publica para que los usuarios verifiquen (se sube como asset del release)
          gpg --armor --export "${GPG_KEY_ID}" > dist/NetProtocol-gpg-pubkey.asc
      - uses: actions/upload-artifact@v4
        with:
          name: setup-linux
          path: FASE-II-DISENO/dist/NetProtocol-*
          if-no-files-found: error

  package-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binario osx-x64
        uses: actions/download-artifact@v4
        with:
          name: app-osx-x64
          path: FASE-II-DISENO/dist/osx-x64
      - name: Crear bundle .app + .dmg
        working-directory: FASE-II-DISENO
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          APP="dist/Net Protocol.app"
          mkdir -p "$APP/Contents/MacOS"
          cp -a dist/osx-x64/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/NetProtocol"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Net Protocol</string>
            <key>CFBundleDisplayName</key><string>Net Protocol</string>
            <key>CFBundleIdentifier</key><string>com.proyectoredes.netprotocol</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>NetProtocol</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "Net Protocol" -srcfolder "$APP" \
            -ov -format UDZO "dist/NetProtocol-${VER}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: setup-macos
          path: FASE-II-DISENO/dist/NetProtocol-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [package-win, package-linux, package-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publicar release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          {
            echo "Net Protocol ${VER} — instaladores oficiales"
            echo ""
            echo "**Incluye:**"
            echo "- **Windows** (win-x64): instalador Inno Setup \`.exe\`"
            echo "- **Linux** (linux-x64): paquete \`.deb\` (Debian/Ubuntu) y \`.rpm\` (Fedora/RHEL/openSUSE)"
            echo "- **macOS** (osx-x64): imagen \`.dmg\`"
            echo ""
            echo "**Notas:** builds self-contained (no requieren .NET instalado). Linux: .rpm firmado (rpmsign) y .deb con firma GPG adjunta (.asc), verificables con `NetProtocol-gpg-pubkey.asc` (si la clave esta configurada en CI). Windows/macOS sin firma de codigo (pendiente de certificados)."
          } > RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" dist/setup-*/* \
            --title "Net Protocol ${VER}" \
            --notes-file RELEASE_NOTES.md