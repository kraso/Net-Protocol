name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restaurar y probar (quality gate A01..A07 + golden-master)
        run: dotnet test FASE-II-DISENO/tests/Redes.Knowledge.Tests/Redes.Knowledge.Tests.csproj --configuration Release

  build:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publicar self-contained (${{ matrix.rid }})
        run: dotnet publish src/Redes.Knowledge.App/Redes.Knowledge.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o dist/${{ matrix.rid }}
        working-directory: FASE-II-DISENO
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: FASE-II-DISENO/dist/${{ matrix.rid }}
          if-no-files-found: error
          # Retención corta: los instaladores son los únicos artefactos que aportan
          # valor a largo plazo (los adjunta el release job); los binarios intermedios
          # solo sirven a los jobs package del mismo run. Evita agotar la cuota de
          # almacenamiento de Actions del repo (500 MB en repos privados; el uso se
          # recalcula cada 6-12 h, motivo por el que un run reciente falló en v1.0.3).
          retention-days: 2

  # ─── Instaladores (solo en tags v*) ────────────────────────────────────────────
  package-win:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binario win-x64
        uses: actions/download-artifact@v4
        with:
          name: app-win-x64
          path: FASE-II-DISENO/dist/win-x64
      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compilar instalador (Inno Setup)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # URL ascendente derivada del repo (mismo patrón que .deb/.rpm).
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          iscc "-DMyAppVersion=${VER}" "-DMyAppUrl=${REPO_URL}" FASE-II-DISENO/packaging/windows/Redes.Knowledge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: setup-win-x64
          path: FASE-II-DISENO/dist/NetProtocol-*-win-x64.exe
          if-no-files-found: error
          retention-days: 2

  package-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binario linux-x64
        uses: actions/download-artifact@v4
        with:
          name: app-linux-x64
          path: FASE-II-DISENO/dist/linux-x64
      - name: Empaquetar .deb (Debian/Ubuntu)
        working-directory: FASE-II-DISENO
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # URL ascendente derivada del repo (GITHUB_REPOSITORY = owner/nombre actuales;
          # sigue los renames del repositorio automáticamente).
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          mkdir -p debroot/DEBIAN debroot/usr/lib/netprotocol debroot/usr/share/applications debroot/usr/share/pixmaps debroot/usr/bin
          cp -a dist/linux-x64/. debroot/usr/lib/netprotocol/
          chmod -R a+rX debroot/usr/lib/netprotocol
          # upload/download-artifact v4 pierde el bit de ejecución al descargar:
          # fijar 0755 explícito en los ELF del apphost (no depender del mode del artefacto).
          chmod 755 debroot/usr/lib/netprotocol/NetProtocol debroot/usr/lib/netprotocol/createdump
          # Icono de menú: PNG 256×256 de Assets (estándar freedesktop).
          cp src/Redes.Knowledge.App/Assets/Logo_NetProtocol.png debroot/usr/share/pixmaps/netprotocol.png
          # Comando en el PATH: wrapper que desactiva la traza del runtime
          # (DOTNET_EnableDiagnostics=0) para NO depender de liblttng-ust/liburcu.
          cat > debroot/usr/bin/netprotocol <<'EOF'
          #!/bin/sh
          export DOTNET_EnableDiagnostics=0
          exec /usr/lib/netprotocol/NetProtocol "$@"
          EOF
          sed -i 's/^          //' debroot/usr/bin/netprotocol
          chmod 755 debroot/usr/bin/netprotocol
          cat > debroot/usr/share/applications/netprotocol.desktop <<'EOF'
          [Desktop Entry]
          Name=Net Protocol
          Comment=Base de conocimiento de protocolos de red
          Exec=/usr/bin/netprotocol
          Icon=netprotocol
          Type=Application
          Categories=Network;
          Terminal=false
          EOF
          sed -i 's/^          //' debroot/usr/share/applications/netprotocol.desktop
          cat > debroot/DEBIAN/control <<EOF
          Package: netprotocol
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Proyecto Redes
          Homepage: ${REPO_URL}
          Description: Net Protocol - base de conocimiento de protocolos de red
           Catálogo, fichas, PDU y seguridad de protocolos de red (Fase I/II).
          EOF
          dpkg-deb --build --root-owner-group debroot "dist/NetProtocol-${VER}-linux-amd64.deb"
      - name: Empaquetar .rpm (Fedora/RHEL)
        working-directory: FASE-II-DISENO
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # rpm no admite guiones en Version (separador version-release); se sustituyen.
          RPM_VER="${VER//-/_}"
          # URL ascendente derivada del repo (mismo patrón que el .deb); un rename
          # del repositorio la actualiza solo vía GITHUB_REPOSITORY.
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          mkdir -p rpmbuild
          DISTDIR="${PWD}/dist/linux-x64"
          cat > netprotocol.spec <<EOF
          Name: netprotocol
          Version: ${RPM_VER}
          Release: 1%{?dist}
          Summary: Net Protocol - base de conocimiento de protocolos de red
          License: Proprietary
          URL: ${REPO_URL}
          BuildArch: x86_64

          %description
          Base de conocimiento/consulta de protocolos de red (catálogo F3, fichas F4, PDU F5, seguridad F6).

          %post
          # Refresco best-effort del menú para que la entrada aparezca sin re-login (KDE/GNOME).
          if command -v update-desktop-database >/dev/null 2>&1; then update-desktop-database -q /usr/share/applications 2>/dev/null || true; fi
          if command -v kbuildsycoca6 >/dev/null 2>&1; then kbuildsycoca6 --noincremental >/dev/null 2>&1 || true; fi

          %install
          mkdir -p %{buildroot}/usr/lib/netprotocol
          cp -a ${DISTDIR}/. %{buildroot}/usr/lib/netprotocol/
          # El artefacto descargado pierde el +x con download-artifact v4: fijar 0755
          # explícito (mismo criterio que el .deb); sin esto, el enlace /usr/bin/netprotocol
          # apunta a un binario no ejecutable y KDE oculta la entrada de menú.
          chmod 755 %{buildroot}/usr/lib/netprotocol/NetProtocol %{buildroot}/usr/lib/netprotocol/createdump
          # Entrada de menú, icono y comando en el PATH (igual que el .deb).
          # Ojo: %install corre con cwd=rpmbuild/BUILD → rutas ABSOLUTAS para el icono
          # (${PWD} se expande al generar el spec, igual que ${DISTDIR}).
          mkdir -p %{buildroot}/usr/share/applications %{buildroot}/usr/share/pixmaps %{buildroot}/usr/bin
          cp ${PWD}/src/Redes.Knowledge.App/Assets/Logo_NetProtocol.png %{buildroot}/usr/share/pixmaps/netprotocol.png
          # Comando en el PATH: wrapper con DOTNET_EnableDiagnostics=0
          # (sin depender de liblttng-ust/liburcu). "\$@" se escapa para que el
          # spec generado conserve los argumentos literalmente.
          cat > %{buildroot}/usr/bin/netprotocol <<'EOW'
          #!/bin/sh
          export DOTNET_EnableDiagnostics=0
          exec /usr/lib/netprotocol/NetProtocol "\$@"
          EOW
          chmod 755 %{buildroot}/usr/bin/netprotocol
          cat > %{buildroot}/usr/share/applications/netprotocol.desktop <<'EOD'
          [Desktop Entry]
          Name=Net Protocol
          Comment=Base de conocimiento de protocolos de red
          Exec=/usr/bin/netprotocol
          Icon=netprotocol
          Type=Application
          Categories=Network;
          Terminal=false
          EOD

          %files
          /usr/lib/netprotocol/*
          /usr/bin/netprotocol
          /usr/share/applications/netprotocol.desktop
          /usr/share/pixmaps/netprotocol.png
          EOF
          sed -i 's/^          //' netprotocol.spec
          rpmbuild --define "_topdir ${PWD}/rpmbuild" -bb netprotocol.spec
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/NetProtocol-${RPM_VER}-linux-x86_64.rpm"
      - name: Empaquetar AppImage (portable)
        working-directory: FASE-II-DISENO
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Descargar appimagetool (AppImage type 2, sin FUSE en CI).
          wget -q -O /tmp/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          # Estructura AppDir estándar.
          APPDIR="dist/NetProtocol.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a dist/linux-x64/. "$APPDIR/usr/bin/"
          chmod 755 "$APPDIR/usr/bin/NetProtocol" "$APPDIR/usr/bin/createdump"
          # Icono (256×256, freedesktop).
          cp src/Redes.Knowledge.App/Assets/Logo_NetProtocol.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/netprotocol.png"
          # Icono raíz del AppDir: COPIA real (el symlink relativo "..icons/..." apuntaba
          # fuera del AppDir y appimagetool no encontraba el icono -> exit 1).
          cp src/Redes.Knowledge.App/Assets/Logo_NetProtocol.png "$APPDIR/netprotocol.png"
          # Entrada de menú.
          cat > "$APPDIR/netprotocol.desktop" <<'EOF'
          [Desktop Entry]
          Name=Net Protocol
          Comment=Base de conocimiento de protocolos de red
          Exec=/usr/bin/NetProtocol
          Icon=netprotocol
          Type=Application
          Categories=Network;
          Terminal=false
          EOF
          sed -i 's/^          //' "$APPDIR/netprotocol.desktop"
          # AppRun: wrapper del runtime (mismo criterio que el .deb/.rpm:
          # DOTNET_EnableDiagnostics=0, sin depender de liblttng-ust/liburcu).
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          export DOTNET_EnableDiagnostics=0
          exec "$(dirname "$0")/usr/bin/NetProtocol" "$@"
          EOF
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod 755 "$APPDIR/AppRun"
          # Generar AppImage (ARCH= x86_64; sin FUSE: --appimage-extract-and-run).
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "dist/NetProtocol-${VER}-linux-x86_64.AppImage"
      - name: Firmar .deb/.rpm con GPG (si la clave esta configurada en secretos)
        working-directory: FASE-II-DISENO
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::Clave GPG no configurada (secretos GPG_PRIVATE_KEY / GPG_KEY_ID): instaladores SIN firmar."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          # La frase es OPCIONAL: con la clave dedicada de CI (sin proteccion) no hace
          # falta. Si se configura GPG_PASSPHRASE se usa loopback + passphrase-fd 0
          # (determinista, sin agente/pinentry); si no, firma directa en batch.
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            PASS=$(printf '%s' "${GPG_PASSPHRASE}" | tr -d '\r\n')
            # rpmsign NO reenvia el stdin de la tuberia a gpg (--passphrase-fd 0 recibe
            # vacio -> "Bad passphrase"): pasar la frase por --passphrase-file.
            printf '%s' "$PASS" > /tmp/netprotocol-pass.txt
            chmod 600 /tmp/netprotocol-pass.txt
            rpmsign --addsign \
              --define "_gpg_name ${GPG_KEY_ID}" \
              --define "__gpg_sign_cmd %{__gpg} gpg --batch --no-tty --pinentry-mode loopback --passphrase-file /tmp/netprotocol-pass.txt --detach-sign -o %{__signature_filename} %{__plaintext_filename}" \
              dist/NetProtocol-*.rpm
            rm -f /tmp/netprotocol-pass.txt
          else
            rpmsign --addsign --define "_gpg_name ${GPG_KEY_ID}" dist/NetProtocol-*.rpm
          fi
          # Verificacion obligatoria del .rpm: importar la clave publica en rpm
          # (sin ella rpm no puede verificar) y comprobar; si fallo, el job falla.
          gpg --armor --export "${GPG_KEY_ID}" > dist/NetProtocol-gpg-pubkey.asc
          rpm --import dist/NetProtocol-gpg-pubkey.asc
          rpm --checksig dist/NetProtocol-*.rpm
          # Firmas adjuntas .asc para los TRES instaladores Linux (deb, rpm,
          # AppImage), siguiendo el patrón `<instalador>.asc`. El firmador clasico
          # del .deb (dpkg-sig) fue retirado de Ubuntu/Debian; gpg --detach-sign
          # --armor es la forma estandar. Se verifica cada una con gpg --verify.
          LINUX_INSTALADORES="dist/NetProtocol-*-linux-amd64.deb dist/NetProtocol-*-linux-x86_64.rpm dist/NetProtocol-*-linux-x86_64.AppImage"
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            for F in $LINUX_INSTALADORES; do
              printf '%s\n' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --detach-sign --armor -u "${GPG_KEY_ID}" "$F"
            done
          else
            for F in $LINUX_INSTALADORES; do
              gpg --batch --yes --detach-sign --armor -u "${GPG_KEY_ID}" "$F"
            done
          fi
          for F in $LINUX_INSTALADORES; do
            gpg --verify "$F.asc" "$F"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: setup-linux
          path: FASE-II-DISENO/dist/NetProtocol-*
          if-no-files-found: error
          retention-days: 2

  package-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - name: Descargar binario osx-x64
        uses: actions/download-artifact@v4
        with:
          name: app-osx-x64
          path: FASE-II-DISENO/dist/osx-x64
      - name: Crear bundle .app + .dmg
        working-directory: FASE-II-DISENO
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          APP="dist/Net Protocol.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -a dist/osx-x64/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/NetProtocol"
          # Generar .icns desde el PNG 256×256 (sips + iconutil, nativos de macOS).
          ICONSET="$APP/Contents/Resources/NetProtocol.iconset"
          mkdir -p "$ICONSET"
          SRC="src/Redes.Knowledge.App/Assets/Logo_NetProtocol.png"
          for SIZE in 16 32 64 128 256; do
            sips -z $SIZE $SIZE "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}.png" >/dev/null
            sips -z $((SIZE*2)) $((SIZE*2)) "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/NetProtocol.icns"
          rm -rf "$ICONSET"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Net Protocol</string>
            <key>CFBundleDisplayName</key><string>Net Protocol</string>
            <key>CFBundleIdentifier</key><string>com.proyectoredes.netprotocol</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>NetProtocol</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>CFBundleIconFile</key><string>NetProtocol.icns</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "Net Protocol" -srcfolder "$APP" \
            -ov -format UDZO "dist/NetProtocol-${VER}-macos-x64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: setup-macos
          path: FASE-II-DISENO/dist/NetProtocol-*.dmg
          if-no-files-found: error
          retention-days: 2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [package-win, package-linux, package-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publicar release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cat > RELEASE_NOTES.md <<EOF
          # Net Protocol ${VER} — instaladores oficiales

          Instaladores **self-contained**: no necesitan tener .NET instalado en el equipo. Disponibles para **Windows** (x64), **Linux** (x64) y **macOS** (x64).

          ## Novedades en esta versión

          - **Linux sin dependencias nativas**: se eliminó el requisito de \`liblttng-ust0\` y \`liburcu6\`. La aplicación arranca con \`DOTNET_EnableDiagnostics=0\`, de modo que el \`.deb\` y el \`.rpm\` se instalan limpios en cualquier distro (antes fallaba el \`dpkg\`/\`dnf\` por versiones mínimas de esas librerías).
          - **Nuevo instalador portátil AppImage**: se ejecuta sin instalar, con icono de escritorio.
          - **Patrón de nombres unificado**: todos los instaladores siguen \`NetProtocol-<versión>-<SO>-<arquitectura>.<extensión>\`.
          - **Firmas GPG**: los tres instaladores Linux llevan su firma \`.asc\` adjunta, y el \`.rpm\` además incorpora firma integrada (\`rpmsign\`). Clave pública de verificación adjunta: \`NetProtocol-gpg-pubkey.asc\`.
          - Icono **256×256** en los menús de Linux y dentro de la AppImage; icono \`.icns\` nativo en el bundle de macOS.

          ---

          ## Windows — \`.exe\` (Inno Setup)

          Descarga \`NetProtocol-${VER}-win-x64.exe\` y haz doble clic. Crea el grupo "Net Protocol" en el menú Inicio, instala en \`%ProgramFiles%\NetProtocol\` y deja un desinstalador. Los datos de la aplicación quedan en \`%LOCALAPPDATA%\NetProtocol\` y **se conservan** al actualizar de versión.

          Instalación silenciosa por línea de comandos:

          \`\`\`powershell
          .\NetProtocol-${VER}-win-x64.exe /VERYSILENT /CURRENTUSER
          \`\`\`

          ## Debian / Ubuntu — \`.deb\`

          \`\`\`bash
          sudo apt install ./NetProtocol-${VER}-linux-amd64.deb
          \`\`\`

          Verificación de la firma (recomendado):

          \`\`\`bash
          gpg --import NetProtocol-gpg-pubkey.asc
          gpg --verify NetProtocol-${VER}-linux-amd64.deb.asc NetProtocol-${VER}-linux-amd64.deb
          \`\`\`

          Al terminar, la aplicación aparece en el menú con su icono y deja el comando \`netprotocol\` disponible en el PATH. No requiere librerías adicionales.

          ## Fedora / RHEL / openSUSE — \`.rpm\`

          Importa la clave pública una sola vez por equipo y verifica la firma integrada del paquete:

          \`\`\`bash
          sudo rpm --import NetProtocol-gpg-pubkey.asc
          rpm -Kv NetProtocol-${VER}-linux-x86_64.rpm   # → "digests signatures OK"
          \`\`\`

          Instala según tu distribución:

          \`\`\`bash
          sudo dnf install ./NetProtocol-${VER}-linux-x86_64.rpm      # Fedora / RHEL
          sudo zypper install ./NetProtocol-${VER}-linux-x86_64.rpm   # openSUSE
          \`\`\`

          Firma GPG adjunta (adicional a la integrada):

          \`\`\`bash
          gpg --import NetProtocol-gpg-pubkey.asc
          gpg --verify NetProtocol-${VER}-linux-x86_64.rpm.asc NetProtocol-${VER}-linux-x86_64.rpm
          \`\`\`

          ## Cualquier distribución Linux — \`.AppImage\` (portable)

          No requiere instalación ni privilegios de administrador:

          \`\`\`bash
          chmod +x NetProtocol-${VER}-linux-x86_64.AppImage
          ./NetProtocol-${VER}-linux-x86_64.AppImage
          \`\`\`

          Verificación de la firma:

          \`\`\`bash
          gpg --verify NetProtocol-${VER}-linux-x86_64.AppImage.asc NetProtocol-${VER}-linux-x86_64.AppImage
          \`\`\`

          ## macOS — \`.dmg\`

          Descarga \`NetProtocol-${VER}-macos-x64.dmg\`, ábrelo y arrastra **Net Protocol.app** a la carpeta Aplicaciones. Como el bundle aún no lleva firma de código de Apple, en el primer arranque haz clic derecho sobre la aplicación → **Abrir**.

          ---

          ## Notas

          - **Windows y macOS** aún no llevan firma de código (certificado pendiente); al descargarlos Windows SmartScreen mostrará un aviso → "Más información" → "Ejecutar de todas formas".
          - **Linux**: la huella de la clave se ve con \`gpg --with-fingerprint NetProtocol-gpg-pubkey.asc\`.
          - Los artefactos de esta release se generan automáticamente por GitHub Actions desde el tag \`v${VER}\` (jobs \`package-win\`, \`package-linux\`, \`package-macos\`).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/setup-*/* \
            --title "Net Protocol ${VER}" \
            --notes-file RELEASE_NOTES.md

  # Job de diagnostico (solo manual): inspecciona la frase almacenada en el secreto
  # (longitud, sha256, espacios, ASCII) y prueba 3 vias de firma, sin revelar el valor.
  diagnostico-gpg:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Diagnosticar secreto GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set +e
          echo "== importar =="
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import 2>&1 | tail -3
          echo "== claves importadas =="
          gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^sec:/{print $5}'
          RAW="${GPG_PASSPHRASE}"
          PASS=$(printf '%s' "$RAW" | tr -d '\r\n')
          echo "== frase almacenada =="
          echo "len_RAW=${#RAW}"
          echo "len_PASS=${#PASS}"
          echo "sha256(PASS)=$(printf '%s' "$PASS" | sha256sum | cut -d' ' -f1)"
          case "$PASS" in " "*|*" ") echo "TIPO=espacios_extremos";; *) echo "TIPO=sin_espacios_extremos";; esac
          if printf '%s' "$PASS" | LC_ALL=C grep -q '[^ -~]'; then echo "CONTENIDO=No-ASCII"; else echo "CONTENIDO=ASCII"; fi
          printf 'x' > /tmp/t.txt
          echo "== firma fd0 =="
          printf '%s\n' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign -u "${GPG_KEY_ID}" /tmp/t.txt 2>&1 | tail -1
          echo "exit_fd0=$?"
          echo "== firma passphrase-file =="
          printf '%s' "$PASS" > /tmp/pf.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-file /tmp/pf.txt --detach-sign -u "${GPG_KEY_ID}" /tmp/t.txt 2>&1 | tail -1
          echo "exit_file=$?"
          echo "== firma passphrase-arg =="
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --detach-sign -u "${GPG_KEY_ID}" /tmp/t.txt 2>&1 | tail -1
          echo "exit_arg=$?"